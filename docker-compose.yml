# =====================================================================
# docker-compose.yml — ОПИСАНИЕ КОНТЕЙНЕРОВ
# ---------------------------------------------------------------------
# Здесь описана база PostgreSQL, которая работает в Docker.
# Запуск: docker compose up -d db     (или npm run db:up)
#   up  — создать и запустить
#   -d  — в фоне (терминал не занят)
#   db  — какой сервис запустить
# Остановить: docker compose stop     Удалить контейнер: docker compose down
#
# Значения ${...} Docker Compose берёт из файла .env в этой же папке —
# поэтому пароль не написан прямо здесь.
# В КТ 5–6 сюда добавятся Redis и само приложение.
# =====================================================================

services:
  db:                                   # имя сервиса (контейнера) — "db"
    image: postgres:16-alpine           # готовый образ PostgreSQL 16 (alpine — облегчённая версия)
    restart: unless-stopped             # перезапускаться сам, если упал (пока мы его не остановили)
    environment:                        # настройки, которые образ postgres читает при первом запуске
      POSTGRES_USER: ${POSTGRES_USER}         # имя пользователя базы  (из .env: blog)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # пароль                 (из .env: blog_password)
      POSTGRES_DB: ${POSTGRES_DB}             # имя базы данных        (из .env: blog)
    ports:
      - "5432:5432"                     # "порт_на_компьютере:порт_в_контейнере"
                                        # благодаря этому приложение подключается к localhost:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
                                        # том: папка с данными базы хранится ОТДЕЛЬНО от контейнера.
                                        # Удалишь контейнер — данные останутся.

volumes:
  postgres-data:                        # объявляем том. Docker хранит его у себя.
